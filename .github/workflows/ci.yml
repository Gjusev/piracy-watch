name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Unit + end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Zero runtime dependencies: the standard library is the stack.
      - run: python -m unittest discover -s tests -v

  dry-run:
    name: CLI smoke (init + dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m piracy_watch init --config /tmp/watch.json
      - run: python -m piracy_watch scan --config /tmp/watch.json --dry-run
